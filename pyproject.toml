[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "editstack"
version = "0.1.0"
description = "Structured, evidence-driven hand-editing of neural-network weights: one stack = one editable model."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
torch = ["torch>=2.0"]
onnx = ["onnx>=1.14"]
dev = ["pytest>=7"]

[project.scripts]
editstack = "editstack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
editstack = ["template/**/*", "template/**/.*", "template/.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
